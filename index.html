<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hue &amp; Tone Palette Playground</title>
<meta name="description" content="色相（Hue）とトーン（Tone）をベースにした配色ツール。サンプルWebサイトの色合いを、配色ルール・トーンを変えながらリアルタイムに確認できます。">
<style>
  /* ===== ツール自体の配色はニュートラルなダーク基調（生成色の評価を妨げない） ===== */
  :root {
    --bg: #16181c;
    --bg-elev: #1e2126;
    --bg-elev-2: #262a30;
    --line: #343a42;
    --line-strong: #4a525c;
    --fg: #e9ecf1;
    --fg-muted: #a4adb9;
    --fg-dim: #737d8a;
    --accent: #6f8fb5;
    --accent-hover: #82a2c7;
    --on-accent: #0d1116;   /* アクセント色の上に載せる文字 */
    --fg-invert: #15181c;   /* 文字色を背景に使うときの文字色（選択中のタブなど） */
    --code-bg: #101317;
    --code-fg: #cdd6e0;
    --ok-line: #3f7d54;  --ok-fg: #93d7a8;
    --warn-line: #7d743f; --warn-fg: #dbcf8f;
    --ng-line: #7d4444;  --ng-fg: #e0a0a0;
    --press-bg: #2f3a47;
    --panel-shadow: 0 18px 56px rgba(0,0,0,.5);
    --radius: 10px;
    --radius-sm: 6px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  }

  /* ライトテーマ（コントロールパネルの配色だけを切り替える） */
  :root[data-theme="light"] {
    --bg: #e9ecf0;
    --bg-elev: #ffffff;
    --bg-elev-2: #f2f4f7;
    --line: #dde1e7;
    --line-strong: #b7bfca;
    --fg: #1b1f25;
    --fg-muted: #566170;
    --fg-dim: #7a8593;
    --accent: #3d6a99;
    --accent-hover: #355f88;
    --on-accent: #ffffff;
    --fg-invert: #ffffff;
    --code-bg: #f5f7fa;
    --code-fg: #2a313a;
    --ok-line: #2f7a4a;  --ok-fg: #1d6b3d;
    --warn-line: #9a7d2a; --warn-fg: #7a6115;
    --ng-line: #b4544f;  --ng-fg: #9c3a35;
    --press-bg: #dde6f1;
    --panel-shadow: 0 18px 48px rgba(24,32,45,.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  /* ===== フローティングパネル（サンプルWebサイトの上に重ねる） ===== */
  .float-panel {
    position: fixed; top: 16px; left: 16px; z-index: 40;
    width: 1040px; max-width: calc(100vw - 32px);
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--panel-shadow);
    display: flex; flex-direction: column; max-height: calc(100vh - 32px);
    overflow: hidden;
  }
  .float-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none;
    cursor: grab; user-select: none; touch-action: none;
  }
  .float-head .main-tabs { flex: 1 1 auto; margin: 0; cursor: auto; }
  .float-head:active { cursor: grabbing; }
  .float-head.dragging { opacity: .85; }
  .float-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; cursor: auto; }
  .float-body {
    overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px;
  }
  .float-panel.collapsed { max-height: none; }
  .float-panel.collapsed .float-body { display: none; }
  .float-panel.collapsed .float-head { border-bottom: 0; }
  .collapse-btn { flex: none; }
  .drag-grip { flex: none; color: var(--fg-dim); font-size: 14px; line-height: 1; padding: 0 2px; }

  /* ===== 汎用パーツ ===== */
  button, select, input { font-family: inherit; font-size: inherit; color: inherit; }

  .btn {
    background: var(--bg-elev-2); color: var(--fg);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    padding: 8px 14px; cursor: pointer; line-height: 1.2;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #303640; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.small { padding: 5px 10px; font-size: 12.5px; }
  .btn.ghost { background: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 0;
  }
  .panel > h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--fg-muted); margin: 0 0 14px; font-weight: 700;
  }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 7px;
  }
  .field-label { font-size: 12.5px; color: var(--fg-muted); font-weight: 700; letter-spacing: .04em; }
  .field-value { font-family: var(--mono); font-size: 12.5px; color: var(--fg-dim); }

  .lock {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--fg-dim); cursor: pointer; user-select: none;
    padding: 2px 6px; border-radius: 999px; border: 1px solid transparent;
  }
  .lock input { accent-color: var(--accent); margin: 0; }
  .lock:has(input:checked) { color: var(--fg); border-color: var(--line-strong); background: var(--bg-elev-2); }

  select {
    width: 100%; background: var(--bg-elev-2); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); padding: 8px 10px;
  }

  /* ===== 色相スライダー ===== */
  .hue-slider { width: 100%; -webkit-appearance: none; appearance: none; background: transparent; margin: 0; }
  .hue-slider::-webkit-slider-runnable-track {
    height: 20px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
    background: linear-gradient(to right,
      hsl(0 90% 50%), hsl(60 90% 50%), hsl(120 90% 50%),
      hsl(180 90% 50%), hsl(240 90% 50%), hsl(300 90% 50%), hsl(360 90% 50%));
  }
  .hue-slider::-moz-range-track {
    height: 20px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
    background: linear-gradient(to right,
      hsl(0 90% 50%), hsl(60 90% 50%), hsl(120 90% 50%),
      hsl(180 90% 50%), hsl(240 90% 50%), hsl(300 90% 50%), hsl(360 90% 50%));
  }
  .hue-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 28px; margin-top: -5px;
    border-radius: 4px; background: #fff; border: 2px solid #101215; cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .hue-slider::-moz-range-thumb {
    width: 14px; height: 26px; border-radius: 4px;
    background: #fff; border: 2px solid #101215; cursor: pointer;
  }

  /* ===== トーンマップ（彩度 × 明度の二次元配置） ===== */
  /* ===== 色相環 × トーンマップ（PCCS の図をそのままコントロールにする） ===== */
  /* 図 2 つと設定を横一列に並べ、パネルが縦に伸びないようにする */
  .settings-grid {
    display: grid; gap: 16px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(210px, 0.85fr);
    align-items: start;
  }
  @media (max-width: 900px) { .settings-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .settings-grid { grid-template-columns: 1fr; } }
  .settings-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .figure { min-width: 0; }
  .figure-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 7px; flex-wrap: wrap;
  }
  .figure-tools { display: inline-flex; align-items: center; gap: 6px; }
  .figure-stage {
    position: relative; width: 100%;
    background: var(--bg-elev-2); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    touch-action: manipulation;
  }
  .wheel-stage { aspect-ratio: 1 / 1; }
  .tone-stage { aspect-ratio: 1.06 / 1; }
  .figure-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 重ねたレイヤーが下の丸のクリックを奪わないよう、丸だけが反応するようにする */
  .pins { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .pin, .handle { pointer-events: auto; }
  .dots-layer { z-index: 3; pointer-events: none; }

  .pin {
    position: absolute; transform: translate(-50%, -50%);
    padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; line-height: 1;
    box-shadow: 0 0 0 1px rgba(0,0,0,.45);
    transition: width .12s, height .12s, box-shadow .12s;
  }
  .pin:hover { z-index: 4; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
  .pin:focus-visible { outline: 2px solid #fff; outline-offset: 2px; z-index: 5; }

  .hue-pin { width: 8.5%; height: 8.5%; font-size: 0; }
  .hue-pin.used { width: 13.5%; height: 13.5%; font-size: 10px; z-index: 3; }
  .hue-pin.current { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(0,0,0,.6); z-index: 4; }

  .tone-pin { width: 15%; height: 15%; font-size: 10px; }

  /* 色ごとのつまみ（ドラッグでその色だけを変える） */
  .handles { z-index: 4; }
  .handle {
    position: absolute; transform: translate(-50%, -50%);
    width: 18px; height: 18px; padding: 0; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.55);
    cursor: grab; touch-action: none;
  }
  @media (pointer: coarse) { .handle { width: 24px; height: 24px; } }
  .handle:active { cursor: grabbing; }
  .handle:hover, .handle.active { width: 24px; height: 24px; z-index: 5; }
  .handle.active { box-shadow: 0 0 0 2px rgba(0,0,0,.55), 0 0 0 5px var(--accent); }
  .handle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; z-index: 6; }
  .tone-pin.current { box-shadow: 0 0 0 2.5px #e2473f, 0 0 0 4.5px rgba(0,0,0,.45); z-index: 4; }

  .tone-axis { font-size: 10.5px; color: var(--fg-dim); display: flex; justify-content: space-between; margin-top: 6px; gap: 6px; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 620px) { .row-2 { grid-template-columns: 1fr; } }

  /* ===== パレット（横に広いカード） ===== */
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(296px, 1fr)); gap: 10px; }
  .card {
    background: var(--bg-elev); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    display: grid; grid-template-columns: 58px 1fr; align-items: stretch;
  }
  .card.locked { border-color: var(--line-strong); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .swatch {
    border: 0; width: 100%; height: 100%; min-height: 76px; cursor: pointer; display: block; padding: 0;
  }
  .card-body { padding: 9px 12px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .card-tags { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .role-badge {
    font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 2px 9px;
    background: var(--accent); color: var(--on-accent); white-space: nowrap;
    border: 1px solid var(--accent); cursor: pointer;
    flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis;
  }
  .role-badge:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .role-badge.empty {
    background: transparent; color: var(--fg-dim); border-color: var(--line-strong); font-weight: 400;
  }
  .role-badge.empty:hover { background: var(--bg-elev-2); color: var(--fg-muted); }
  .hex {
    font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: .02em;
    flex: 1 1 auto; min-width: 0;
  }
  .tone-badge {
    font-size: 10.5px; color: var(--fg-muted); background: var(--bg-elev-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px;
    white-space: nowrap; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis;
  }
  .lock-btn {
    flex: none; width: 26px; height: 26px; padding: 0; line-height: 1;
    background: var(--bg-elev-2); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
  }
  .lock-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--press-bg); }
  .contrast { display: flex; flex-wrap: wrap; gap: 5px; }
  .cbadge {
    font-size: 10px; font-family: var(--mono); border-radius: 4px; padding: 2px 6px;
    border: 1px solid var(--line-strong); display: inline-flex; gap: 5px; align-items: center;
  }
  .cbadge .lvl { font-weight: 700; }
  .cbadge.pass-aaa { border-color: var(--ok-line); color: var(--ok-fg); }
  .cbadge.pass-aa  { border-color: var(--warn-line); color: var(--warn-fg); }
  .cbadge.fail     { border-color: var(--ng-line); color: var(--ng-fg); }
  .adjust { display: grid; gap: 4px; }
  .adjust label {
    display: grid; grid-template-columns: 18px 1fr 34px; gap: 6px; align-items: center;
    font-size: 11px; color: var(--fg-dim); font-family: var(--mono);
  }
  .adjust input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }

  /* ===== 折りたたみセクション（パレット・エクスポート・履歴） ===== */
  .main-tabs { flex-wrap: wrap; }
  .pane[hidden] { display: none; }

  /* ===== エクスポート ===== */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tab {
    background: transparent; border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 5px 13px; font-size: 12.5px; cursor: pointer; color: var(--fg-muted);
  }
  .tab[aria-selected="true"] { background: var(--fg); color: var(--fg-invert); border-color: var(--fg); font-weight: 700; }
  pre.code {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 13px; margin: 0 0 12px; overflow-x: auto;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.65; color: var(--code-fg);
    max-height: 240px; white-space: pre;
  }
  .export-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ===== 履歴 ===== */
  .history { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .history-item {
    padding: 0; border: 1px solid var(--line); background: var(--bg-elev-2);
    border-radius: var(--radius-sm); cursor: pointer; overflow: hidden; text-align: left;
  }
  .history-item:hover { border-color: var(--line-strong); }
  .history-strip { display: flex; height: 34px; }
  .history-strip span { flex: 1; }
  .history-meta { font-size: 10.5px; color: var(--fg-dim); padding: 5px 7px; line-height: 1.35; }
  .empty { color: var(--fg-dim); font-size: 13px; margin: 0; }

  /* ===== トースト ===== */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 18px);
    background: var(--fg); color: var(--fg-invert); font-weight: 700; font-size: 13.5px;
    padding: 10px 20px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 50;
    max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ===== サンプル：英字新聞 ===== */
  .paper { min-height: 100vh; padding: 28px 20px 60px; }
  .paper-inner {
    max-width: 1080px; margin: 0 auto;
    font-family: Georgia, "Times New Roman", "Noto Serif JP", serif;
  }
  .paper-masthead { text-align: center; padding-bottom: 10px; }
  .paper-masthead h1 {
    margin: 0; font-size: clamp(34px, 7vw, 68px); letter-spacing: .06em;
    font-weight: 900; line-height: 1;
  }
  .paper-sub {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    padding: 8px 0; margin-top: 12px;
  }
  .paper-rule { height: 3px; }
  .paper-rule.thin { height: 1px; margin-top: 2px; }
  .paper-lead { display: grid; grid-template-columns: 2.1fr 1fr; gap: 26px; padding: 22px 0; }
  @media (max-width: 760px) { .paper-lead { grid-template-columns: 1fr; } }
  .paper-kicker {
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    font-weight: 700; margin-bottom: 8px; display: inline-block; padding: 2px 8px;
  }
  .paper-lead h2 { margin: 0 0 10px; font-size: clamp(26px, 4vw, 42px); line-height: 1.12; font-weight: 900; }
  .paper-standfirst { margin: 0 0 16px; font-size: 16px; line-height: 1.5; font-style: italic; }
  .paper-photo { aspect-ratio: 16 / 8; border-radius: 2px; position: relative; overflow: hidden; }
  .paper-photo span { position: absolute; }
  .paper-caption { font-size: 11px; margin-top: 6px; letter-spacing: .04em; }
  .paper-cols { columns: 2; column-gap: 22px; font-size: 13.5px; line-height: 1.62; margin-top: 14px; }
  @media (max-width: 560px) { .paper-cols { columns: 1; } }
  .paper-cols p { margin: 0 0 10px; }
  .paper-cols p:first-child::first-letter {
    float: left; font-size: 46px; line-height: .82; padding: 4px 8px 0 0; font-weight: 900;
  }
  .paper-aside { border-left-width: 1px; border-left-style: solid; padding-left: 18px; }
  @media (max-width: 760px) { .paper-aside { border-left: 0; padding-left: 0; } }
  .paper-aside h3 {
    margin: 0 0 10px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    padding-bottom: 6px; border-bottom-width: 2px; border-bottom-style: solid;
  }
  .paper-item { padding: 9px 0; border-bottom-width: 1px; border-bottom-style: solid; }
  .paper-item h4 { margin: 0 0 3px; font-size: 14px; line-height: 1.3; }
  .paper-item p { margin: 0; font-size: 11.5px; }
  .paper-quote {
    margin: 16px 0 0; padding: 14px 16px; font-size: 15px; font-style: italic; line-height: 1.45;
  }
  .paper-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; padding: 20px 0; }
  @media (max-width: 760px) { .paper-grid { grid-template-columns: 1fr; } }
  .paper-grid h3 { margin: 0 0 8px; font-size: 19px; line-height: 1.2; }
  .paper-grid p { margin: 0 0 8px; font-size: 13px; line-height: 1.6; }
  .paper-tag { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; }
  .paper-ad {
    margin-top: 16px; padding: 14px 12px; text-align: center;
    border-width: 2px; border-style: double; display: grid; gap: 6px;
  }
  .paper-ad strong { font-size: 17px; letter-spacing: .12em; }
  .paper-ad span:last-child { font-size: 11px; line-height: 1.5; }
  .paper-strip { display: flex; gap: 0; height: 10px; margin: 18px 0; }
  .paper-strip span { flex: 1; }
  .paper-foot {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding-top: 12px;
  }

  /* ===== サンプルWebサイト（メイン・ページ全体） ===== */
  .site {
    min-height: 100vh;
    border-radius: 0; border: 0;
    box-shadow: none;
  }
  .site a { text-decoration: none; }
  .site-inner { font-size: 15px; line-height: 1.6; }

  .site-nav { position: sticky; top: 0; z-index: 10; border-radius: var(--radius) var(--radius) 0 0; }
  .nav-inner {
    max-width: 1080px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .nav-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: .01em; }
  .nav-logo .logo-mark { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .nav-links { display: flex; gap: 24px; font-size: 14px; font-weight: 600; }
  .nav-links a:hover { opacity: .7; }
  .nav-cta { display: flex; gap: 12px; align-items: center; }
  .nav-cta .login { font-size: 14px; font-weight: 600; }
  .nav-cta .login:hover { opacity: .7; }

<script>
(() => {
  "use strict";

  /* =========================================================================
   * 1. 定数
   * ========================================================================= */
  const HUE_MAX = 360;
  const MIN_COLORS = 2;
  const MAX_COLORS = 6;
  const DEFAULT_COLORS = 5;
  const HISTORY_LIMIT = 10;
  const TOAST_MS = 1600;

  // WCAG のコントラスト比しきい値
  const WCAG = { AA_LARGE: 3, AA: 4.5, AAA: 7 };

  // 色相ごとの見た目の明るさの差を補正する強さ（0 で補正なし）
  const HUE_COMP_STRENGTH = 9;

  // トーン範囲内での値の散らし方（先頭ほど中央寄り＝トーンの印象を保つ）
  const SPREAD_STEPS = [0.5, 0.18, 0.82, 0.34, 0.66, 0.04];

  // トーン判定時の重み（明度のほうが印象に効くため大きめ）
  const TONE_WEIGHT_S = 1;
  const TONE_WEIGHT_L = 1.4;
  const TONE_EXACT_DISTANCE = 7; // これを超えたら「≈」付きで近似表示

  /* =========================================================================
   * 2. 色変換ユーティリティ（HEX / RGB / HSL）
   * ========================================================================= */
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const round = (v) => Math.round(v);
  const normalizeHue = (h) => ((h % HUE_MAX) + HUE_MAX) % HUE_MAX;
  const lerp = (a, b, t) => a + (b - a) * t;

  /** HSL（h:0-360, s/l:0-100）→ RGB（各 0-255） */
  function hslToRgb(h, s, l) {
    h = normalizeHue(h); s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let rgb;
    if (h < 60) rgb = [c, x, 0];
    else if (h < 120) rgb = [x, c, 0];
    else if (h < 180) rgb = [0, c, x];
    else if (h < 240) rgb = [0, x, c];
    else if (h < 300) rgb = [x, 0, c];
    else rgb = [c, 0, x];
    return { r: round((rgb[0] + m) * 255), g: round((rgb[1] + m) * 255), b: round((rgb[2] + m) * 255) };
  }

  /** RGB（各 0-255）→ HSL（h:0-360, s/l:0-100） */
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const d = max - min;
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (d !== 0) {
      s = d / (1 - Math.abs(2 * l - 1));
      if (max === r) h = 60 * (((g - b) / d) % 6);
      else if (max === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
    }
    return { h: normalizeHue(h), s: clamp(s * 100, 0, 100), l: clamp(l * 100, 0, 100) };
  }

  /** RGB → HEX（#rrggbb） */
  function rgbToHex(r, g, b) {
    const hex = (v) => clamp(round(v), 0, 255).toString(16).padStart(2, "0");
    return "#" + hex(r) + hex(g) + hex(b);
  }

  /** HEX（#rgb / #rrggbb）→ RGB。無効な値は null */
  function hexToRgb(hex) {
    const m = String(hex).trim().replace(/^#/, "");
    const full = m.length === 3 ? m.split("").map((c) => c + c).join("") : m;
    if (!/^[0-9a-f]{6}$/i.test(full)) return null;
    return {
      r: parseInt(full.slice(0, 2), 16),
      g: parseInt(full.slice(2, 4), 16),
      b: parseInt(full.slice(4, 6), 16),
    };
  }

  const hslToHex = (h, s, l) => { const { r, g, b } = hslToRgb(h, s, l); return rgbToHex(r, g, b); };
  const hexToHsl = (hex) => { const rgb = hexToRgb(hex); return rgb ? rgbToHsl(rgb.r, rgb.g, rgb.b) : null; };

  /** sRGB の相対輝度（WCAG 2.x 準拠） */
  function relativeLuminance(r, g, b) {
    const ch = [r, g, b].map((v) => {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }

  /** 2 色のコントラスト比（1〜21） */
  function contrastRatio(hexA, hexB) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    if (!a || !b) return 1;
    const la = relativeLuminance(a.r, a.g, a.b), lb = relativeLuminance(b.r, b.g, b.b);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  /** コントラスト比 → WCAG 判定レベル */
  function wcagLevel(ratio) {
    if (ratio >= WCAG.AAA) return { label: "AAA", cls: "pass-aaa" };
    if (ratio >= WCAG.AA) return { label: "AA", cls: "pass-aa" };
    if (ratio >= WCAG.AA_LARGE) return { label: "AA大", cls: "pass-aa" };
    return { label: "NG", cls: "fail" };
  }

  /** 背景色に対して読みやすい方（白 or 黒）を返す */
  const bestTextOn = (hex) => (contrastRatio(hex, "#ffffff") >= contrastRatio(hex, "#000000") ? "#ffffff" : "#000000");

  /** 2 色を t の割合で混ぜる（t=0 で a、t=1 で b） */
  function mixHex(hexA, hexB, t) {
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    if (!a || !b) return hexA;
    return rgbToHex(lerp(a.r, b.r, t), lerp(a.g, b.g, t), lerp(a.b, b.b, t));

    { n: 2,  code: "R",  jp: "赤",       h: 358 },
    { n: 3,  code: "yR", jp: "黄みの赤", h: 10 },
    { n: 4,  code: "rO", jp: "赤みの橙", h: 18 },
    { n: 5,  code: "O",  jp: "橙",       h: 26 },
    { n: 6,  code: "yO", jp: "黄みの橙", h: 35 },
    { n: 7,  code: "rY", jp: "赤みの黄", h: 44 },
    { n: 8,  code: "Y",  jp: "黄",       h: 53 },
    { n: 9,  code: "gY", jp: "緑みの黄", h: 62 },
    { n: 10, code: "YG", jp: "黄緑",     h: 78 },
    { n: 11, code: "yG", jp: "黄みの緑", h: 96 },
    { n: 12, code: "G",  jp: "緑",       h: 125 },
    { n: 13, code: "bG", jp: "青みの緑", h: 152 },

    { n: 15, code: "BG", jp: "青緑",     h: 180 },
    { n: 16, code: "gB", jp: "緑みの青", h: 190 },
    { n: 17, code: "B",  jp: "青",       h: 200 },
    { n: 18, code: "B",  jp: "青",       h: 210 },
    { n: 19, code: "pB", jp: "紫みの青", h: 222 },
    { n: 20, code: "V",  jp: "青紫",     h: 236 },
    { n: 21, code: "bP", jp: "青みの紫", h: 258 },
    { n: 22, code: "P",  jp: "紫",       h: 275 },
    { n: 23, code: "rP", jp: "赤みの紫", h: 295 },
    { n: 24, code: "RP", jp: "赤紫",     h: 320 },

  const TONES = [
    { id: "pale",    name: "ペール",       abbr: "p",  s: [22, 34],  l: [84, 90], col: 2, row: 1 },
    { id: "light",   name: "ライト",       abbr: "lt", s: [44, 58],  l: [70, 78], col: 3, row: 2 },
    { id: "soft",    name: "ソフト",       abbr: "sf", s: [40, 52],  l: [58, 66], col: 3, row: 3 },
    { id: "bright",  name: "ブライト",     abbr: "b",  s: [78, 92],  l: [58, 66], col: 4, row: 3 },
    { id: "grayish", name: "グレイッシュ", abbr: "g",  s: [10, 20],  l: [46, 56], col: 1, row: 4 },
    { id: "dull",    name: "ダル",         abbr: "d",  s: [32, 44],  l: [44, 54], col: 2, row: 4 },
    { id: "strong",  name: "ストロング",   abbr: "s",  s: [66, 80],  l: [44, 52], col: 3, row: 4 },
    { id: "vivid",   name: "ビビッド",     abbr: "v",  s: [92, 100], l: [46, 54], col: 4, row: 4 },
    { id: "dark",    name: "ダーク",       abbr: "dk", s: [55, 70],  l: [20, 28], col: 2, row: 5 },
    { id: "deep",    name: "ディープ",     abbr: "dp", s: [82, 96],  l: [28, 36], col: 4, row: 5 },
  ];

  /** PCCS の色相番号 → HSL の色相 */
  const pccsToHue = (n) => (PCCS_HUES.find((x) => x.n === n) || PCCS_HUES[0]).h;

  /**
   * HSL の色相 → 色相環上の位置（PCCS の並びに合わせた 1〜25 の連続値）。
   * PCCS の色相は等間隔ではないため、隣り合う基準色相の間を補間する。
   */
  function hueToPccsPos(h) {
    h = normalizeHue(h);
    for (let i = 0; i < PCCS_HUES.length; i++) {
      const a = PCCS_HUES[i], b = PCCS_HUES[(i + 1) % PCCS_HUES.length];
      const span = normalizeHue(b.h - a.h) || 360;
      const d = normalizeHue(h - a.h);
      if (d < span) return a.n + d / span;
    }
    return 8;
  }

  /** 色相環の角度（PCCS 8:Y を真上に置き、時計回りに 24 等分） */
  const hueToAngle = (h) => (hueToPccsPos(h) - 8) * 15 - 90;
  const pccsAngle = (n) => (n - 8) * 15 - 90;
  const toRad = (deg) => (deg * Math.PI) / 180;

  /** 色相環の半径と、トーンマップの描画範囲（いずれもステージに対する %） */
  const WHEEL_R = 39;       // PCCS の丸を並べる半径
  const HANDLE_R = 27;      // 色ごとのつまみを置く半径（線の上・ピンの内側）
  const TONE_PLOT = { x: [8, 82], y: [10, 88] };
  const TONE_COLS = 4;  // 左ほど低彩度
  const TONE_ROWS = 5;  // 上ほど明るい

  /** トーンマップの升目（列＝彩度、行＝明度）の中心座標 */
  const cellX = (col) => TONE_PLOT.x[0] + ((col - 0.5) / TONE_COLS) * (TONE_PLOT.x[1] - TONE_PLOT.x[0]);
  const cellY = (row) => TONE_PLOT.y[0] + ((row - 0.5) / TONE_ROWS) * (TONE_PLOT.y[1] - TONE_PLOT.y[0]);
  const cellW = (TONE_PLOT.x[1] - TONE_PLOT.x[0]) / TONE_COLS;
  const cellH = (TONE_PLOT.y[1] - TONE_PLOT.y[0]) / TONE_ROWS;

  /**
   * 色をトーンマップ上の座標に置く。まず属するトーンの升目に置き、
   * トーンの中心からのずれぶんだけ升目の中で動かす（微調整が見えるようにする）。
   */
  function colorToTonePos(sat, lig) {
    const tone = classifyTone(sat, lig).tone;
    const c = toneCenter(tone);
    const dx = clamp((sat - c.s) / Math.max(1, tone.s[1] - tone.s[0]), -0.5, 0.5);
    const dy = clamp((c.l - lig) / Math.max(1, tone.l[1] - tone.l[0]), -0.5, 0.5);
    return { x: cellX(tone.col) + dx * cellW * 0.88, y: cellY(tone.row) + dy * cellH * 0.88 };
  }

  /** 色相環上の位置（1〜25 の連続値）→ HSL の色相（hueToPccsPos の逆） */
  function pccsPosToHue(pos) {
    const n = Math.floor(pos), f = pos - n;
    const a = PCCS_HUES[(((n - 1) % 24) + 24) % 24];
    const b = PCCS_HUES[((n % 24) + 24) % 24];
    const span = normalizeHue(b.h - a.h) || 360;
    return normalizeHue(a.h + f * span);
  }

  /** 色相環上の座標（ステージの %）→ 色相 */
  function posToHue(x, y) {
    const angle = (Math.atan2(y - 50, x - 50) * 180) / Math.PI;
    return pccsPosToHue((angle + 90) / 15 + 8);
  }

  /**
   * トーンマップ上の座標（ステージの %）→ 彩度・明度。
   * 最も近いトーンの升目を選び、その中でのずれを彩度・明度のレンジに割り当てる。
   */
  function posToTone(x, y) {
    let best = TONES[0], bestDist = Infinity;
    for (const t of TONES) {
      const d = Math.hypot((x - cellX(t.col)) / cellW, (y - cellY(t.row)) / cellH);
      if (d < bestDist) { bestDist = d; best = t; }
    }
    const c = toneCenter(best);
    const dx = clamp((x - cellX(best.col)) / (cellW * 0.88), -0.5, 0.5);
    const dy = clamp((y - cellY(best.row)) / (cellH * 0.88), -0.5, 0.5);
    return {
      s: clamp(c.s + dx * (best.s[1] - best.s[0]), 0, 100),
      l: clamp(c.l - dy * (best.l[1] - best.l[0]), 0, 100),
    };
  }

  /** 2 つの色相の差（0〜180） */
  const hueGap = (a, b) => { const d = Math.abs(normalizeHue(a) - normalizeHue(b)); return Math.min(d, 360 - d); };


  // トーンオントーン（同一色相・トーン違い）で使う、明度順のトーン梯子
  const TONE_LADDER = ["pale", "light", "soft", "dull", "strong", "deep", "dark"];

  const getTone = (id) => TONES.find((t) => t.id === id) || TONES[0];
  const toneCenter = (tone) => ({ s: (tone.s[0] + tone.s[1]) / 2, l: (tone.l[0] + tone.l[1]) / 2 });

  /**
   * 同じ HSL 明度でも色相によって明るさの印象が変わる（黄は明るく、青は暗く見える）。
   * 純色の相対輝度を基準に明度を微調整し、色相を変えてもトーンの印象を保つ。
   */
  function hueLightnessCompensation(h) {
    const { r, g, b } = hslToRgb(h, 100, 50);
    const lum = relativeLuminance(r, g, b); // 概ね 0.07（青）〜 0.93（黄）
    return (0.35 - lum) * HUE_COMP_STRENGTH;
  }

  /**
   * トーンの範囲内から index 番目の彩度・明度を決める（色相補正込み）。
   * 補正後も必ずトーンのレンジ内に収め、色相が変わってもトーンの印象を保つ。
   */
  function toneColor(hue, tone, index) {
    const t = SPREAD_STEPS[index % SPREAD_STEPS.length];
    const s = clamp(lerp(tone.s[0], tone.s[1], t), tone.s[0], tone.s[1]);
    const l = clamp(lerp(tone.l[0], tone.l[1], t) + hueLightnessCompensation(hue), tone.l[0], tone.l[1]);
    return { h: normalizeHue(hue), s, l };
  }

  /** 彩度・明度から最も近いトーンを判定する（カード上で微調整した色のラベル用） */
  function classifyTone(s, l) {
    let best = TONES[0], bestDist = Infinity;
    for (const tone of TONES) {
      const ds = s < tone.s[0] ? tone.s[0] - s : s > tone.s[1] ? s - tone.s[1] : 0;
      const dl = l < tone.l[0] ? tone.l[0] - l : l > tone.l[1] ? l - tone.l[1] : 0;
      const dist = Math.hypot(ds * TONE_WEIGHT_S, dl * TONE_WEIGHT_L);
      if (dist < bestDist) { bestDist = dist; best = tone; }
    }
    return { tone: best, exact: bestDist <= TONE_EXACT_DISTANCE, label: (bestDist <= TONE_EXACT_DISTANCE ? "" : "≈") + best.name };
  }

  /* =========================================================================
   * 4. 配色ルール（基準色相から他の色相を算出する）
   *    offsets: 色相のオフセット（度）。mode 付きは特殊処理。
   * ========================================================================= */
  const RULES = [
    { id: "mono",          name: "単色（Monochromatic）",        mode: "mono",
      desc: "同一色相のまま明度・彩度だけを変化させる、最もまとまりやすい配色。" },
    { id: "analogous",     name: "類似色（Analogous ±30°）",      offsets: [0, 30, -30, 60, -60, 90],
      desc: "隣り合う色相（±30°）でまとめる、穏やかで調和しやすい配色。" },
    { id: "complementary", name: "補色（Complementary +180°）",   offsets: [0, 180, 30, 210, -30, 150],
      desc: "色相環の正反対（+180°）を組み合わせる、対比の強い配色。" },
    { id: "split",         name: "分裂補色（Split ±150°）",       offsets: [0, 150, 210, 30, -30, 180],
      desc: "補色の両隣（±150°）を使い、対比を保ちつつ緊張をやわらげる配色。" },
    { id: "triadic",       name: "トライアド（Triadic ±120°）",   offsets: [0, 120, 240, 60, 180, 300],
      desc: "色相環を三等分（±120°）する、鮮やかでバランスの取れた配色。" },
    { id: "tetradic",      name: "テトラード（Tetradic 90°）",    offsets: [0, 90, 180, 270, 45, 225],
      desc: "色相環を四等分（+90/180/270°）する、変化に富んだ配色。" },
    { id: "toneOnTone",    name: "トーンオントーン（同一色相）",   mode: "toneOnTone",
      desc: "同一色相でトーン（明度差）を変えて重ねる、統一感のある配色。" },
    { id: "toneInTone",    name: "トーンイントーン（同一トーン）", mode: "toneInTone",
      desc: "同じトーンのまま色相だけを変える、トーンの印象で統一する配色。" },
  ];
  const getRule = (id) => RULES.find((r) => r.id === id) || RULES[1];

  // トーンオントーン用：梯子上で選択トーンを中心に、重複しない count 個のトーンを選ぶ
  function pickLadderTones(baseToneId, count) {
    const ladder = TONE_LADDER.map(getTone);
    let center = ladder.findIndex((t) => t.id === baseToneId);
    if (center < 0) center = Math.floor(ladder.length / 2);
    const picked = [ladder[center]];
    // 中心トーンから交互に明るい側・暗い側へ広げる
    for (let offset = 1; offset < ladder.length && picked.length < count; offset++) {
      for (const dir of [-1, 1]) {
        const t = ladder[center + dir * offset];
        if (t && !picked.includes(t) && picked.length < count) picked.push(t);
      }
    }
    // 梯子を使い切った場合は明度順に並べたうえで先頭から繰り返す
    picked.sort((a, b) => toneCenter(b).l - toneCenter(a).l);
    while (picked.length < count) picked.push(picked[picked.length % ladder.length]);
    return picked;
  }

  /* =========================================================================
   * 5. パレット生成
   * ========================================================================= */
  /** 設定（基準色相・トーン・ルール・色数）から HSL の配列をつくる */
  function generatePalette({ baseHue, toneId, ruleId, count }) {
    const rule = getRule(ruleId);
    const tone = getTone(toneId);
    const n = clamp(count, MIN_COLORS, MAX_COLORS);
    const out = [];

    if (rule.mode === "mono") {
      // 同一色相：トーン中心から明度を上下に広げ、彩度はトーン範囲内で散らす
      const center = toneCenter(tone);
      const spanL = 18;
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0.5 : i / (n - 1);
        const l = clamp(center.l + lerp(spanL, -spanL, t) + hueLightnessCompensation(baseHue), 8, 94);
        const s = clamp(lerp(tone.s[0], tone.s[1], SPREAD_STEPS[i % SPREAD_STEPS.length]), 0, 100);
        out.push({ h: normalizeHue(baseHue), s, l });
      }
    } else if (rule.mode === "toneOnTone") {
      // 同一色相・トーン違い
      pickLadderTones(tone.id, n).forEach((t, i) => out.push(toneColor(baseHue, t, i)));
    } else if (rule.mode === "toneInTone") {
      // 同一トーン・色相違い（±90° の範囲に均等配置）
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0.5 : i / (n - 1);
        out.push(toneColor(baseHue + lerp(-90, 90, t), tone, i));
      }
    } else {
      // 色相オフセット方式
      for (let i = 0; i < n; i++) out.push(toneColor(baseHue + rule.offsets[i % rule.offsets.length], tone, i));
    }
    return out;
  }

  /* =========================================================================
   * 5.5 色の役割
   *     どの色をどこに使うかは、パレットを作り直したときにだけ決める。
   *     1 色だけを調整したときは役割を入れ替えないので、ボタンの色は
   *     その色をドラッグしても付いてくる。
   * ========================================================================= */
  const ROLES = [
    { id: "base",      label: "背景" },
    { id: "text",      label: "本文" },
    { id: "accent",    label: "アクセント" },
    { id: "secondary", label: "サブ" },
  ];

  function assignRoles() {
    const idx = state.cards.map((_, i) => i);
    if (!idx.length) { state.roles = { base: 0, text: 0, accent: 0, secondary: 0 }; return; }
    const byL = [...idx].sort((a, b) => state.cards[a].l - state.cards[b].l);
    const base = byL[byL.length - 1];  // 最も明るい色を背景に
    const text = byL[0];               // 最も暗い色を文字に
    // アクセントは最も彩度の高い色。ただし背景と同じ色になると面が沈むので、
    // 色数が少ないときは「背景以外」を優先する。
    const mostVivid = (list) => list.reduce((a, i) => (state.cards[i].s > state.cards[a].s ? i : a), list[0]);
    const free = (i) => i !== base && i !== text;
    const accent = mostVivid(idx.filter(free))
      ?? mostVivid(idx.filter((i) => i !== base))
      ?? base;
    const secondary = idx.find((i) => free(i) && i !== accent)
      ?? idx.find((i) => i !== base && i !== accent)
      ?? accent;
    state.roles = { base, text, accent, secondary };
  }

  /**
   * その色に割り当てられた役割。色数が少ないと 1 色が複数の役割を兼ねるので、
   * 該当するものをすべて返す（なければ空文字）。
   */
  function roleOf(index) {
    return ROLES.filter((r) => state.roles[r.id] === index).map((r) => r.label).join("・");
  }

  /** その色が次に取る役割（背景 → 本文 → アクセント → サブ → 背景…） */
  function nextRoleId(index) {
    const mine = ROLES.findIndex((r) => state.roles[r.id] === index);
    return ROLES[(mine + 1) % ROLES.length].id;   // 役割がなければ先頭（背景）から
  }

  /**
   * 役割を付け替える。相手がすでにその役割を持っていれば、この色が持っていた
   * 役割と交換する（どの役割も必ずどこかの色に残るようにする）。
   */
  function swapRole(index, roleId) {
    const owner = state.roles[roleId];
    if (owner === index) return false;
    const mine = ROLES.filter((r) => state.roles[r.id] === index).map((r) => r.id);
    state.roles[roleId] = index;
    if (mine.length) state.roles[mine[0]] = owner;   // 持っていた役割を相手に渡す
    return true;
  }

  /* =========================================================================
   * 6. 状態（DOM からは読み戻さず、常にこの state を唯一の情報源とする）
   * ========================================================================= */
  const state = {
    baseHue: 210,
    toneId: "pale",
    ruleId: "analogous",
    count: DEFAULT_COLORS,
    lockHue: false,
    lockTone: false,
    lockRule: false,
    cards: [],       // { h, s, l, locked }
    exportTab: "hex",
    mainPane: "settings",  // 配色設定 / パレット / エクスポート / 履歴のどれを表示しているか
    activeCard: null,      // ドラッグ中・選択中の色（図の塗りの基準にする）
    roles: { base: 0, text: 0, accent: 0, secondary: 0 },  // 色の役割（インデックス）
    theme: "dark",         // コントロールパネルの配色（dark / light）
    sample: "web",         // プレビューの種類（web / paper）
    history: [],     // 直近の生成結果（メモリ上）
  };

  const EXPORT_TABS = [
    { id: "hex", label: "HEX リスト" },
    { id: "css", label: "CSS 変数" },
    { id: "tailwind", label: "Tailwind 風" },
    { id: "json", label: "JSON" },
  ];

  /** 設定からカードを作り直す。ロック中のカードは維持する。 */
  function regenerate() {
    const generated = generatePalette(state);
    state.cards = generated.map((c, i) => {
      const prev = state.cards[i];
      if (prev && prev.locked) return prev;
      return { h: c.h, s: c.s, l: c.l, locked: false };
    });
    assignRoles();
  }

  /** ランダム生成（固定された項目は変更しない） */
  function randomize() {
    if (!state.lockHue) state.baseHue = Math.floor(Math.random() * HUE_MAX);
    if (!state.lockTone) state.toneId = TONES[Math.floor(Math.random() * TONES.length)].id;
    if (!state.lockRule) state.ruleId = RULES[Math.floor(Math.random() * RULES.length)].id;
    state.activeCard = null;
    regenerate();
    pushHistory();
    render();
  }

  /* =========================================================================
   * 7. 履歴（メモリ上に直近 HISTORY_LIMIT 件）
   * ========================================================================= */
  function pushHistory() {
    const snapshot = {
      baseHue: state.baseHue, toneId: state.toneId, ruleId: state.ruleId, count: state.count,
      cards: state.cards.map((c) => ({ ...c })),
      roles: { ...state.roles },
      hexes: state.cards.map(cardHex),
    };
    const last = state.history[0];
    if (last && last.hexes.join() === snapshot.hexes.join()) {
      last.roles = { ...state.roles };   // 色は同じで役割だけ変えた場合に備える
      return;                            // 同一パレットは積まない
    }
    state.history.unshift(snapshot);
    if (state.history.length > HISTORY_LIMIT) state.history.length = HISTORY_LIMIT;
    // 再描画のあとに積まれる場合（色相スライダーを離したとき）もその場で表示に反映する
    renderHistory();
  }

  function restoreHistory(index) {
    const item = state.history[index];
    if (!item) return;
    state.baseHue = item.baseHue;
    state.toneId = item.toneId;
    state.ruleId = item.ruleId;
    state.count = item.count;
    state.cards = item.cards.map((c) => ({ ...c }));
    if (item.roles) state.roles = { ...item.roles };
    state.activeCard = null;
    render();
    showToast("履歴を復元しました");
  }

  /* =========================================================================
   * 8. 共有 URL（基準色相・トーン・ルール・色数をクエリに反映）
   * ========================================================================= */
  function stateToQuery() {
    const p = new URLSearchParams();
    p.set("h", String(round(state.baseHue)));
    p.set("tone", state.toneId);
    p.set("rule", state.ruleId);
    p.set("n", String(state.count));
    if (state.sample !== "web") p.set("sample", state.sample);
    return p.toString();
  }

  function applyQuery() {
    const p = new URLSearchParams(location.search);
    const h = parseInt(p.get("h"), 10);
    if (Number.isFinite(h)) state.baseHue = normalizeHue(h);
    if (p.get("tone") && TONES.some((t) => t.id === p.get("tone"))) state.toneId = p.get("tone");
    if (p.get("rule") && RULES.some((r) => r.id === p.get("rule"))) state.ruleId = p.get("rule");
    const n = parseInt(p.get("n"), 10);
    if (Number.isFinite(n)) state.count = clamp(n, MIN_COLORS, MAX_COLORS);
    if (p.get("sample") === "paper") state.sample = "paper";
  }

  const syncUrl = () => history.replaceState(null, "", location.pathname + "?" + stateToQuery());
  const shareUrl = () => location.origin + location.pathname + "?" + stateToQuery();

  /* =========================================================================
   * 9. エクスポート生成
   * ========================================================================= */
  const cardHex = (c) => hslToHex(c.h, c.s, c.l);

  function colorDetails(c) {
    const hex = cardHex(c);
    const { r, g, b } = hslToRgb(c.h, c.s, c.l);
    const cls = classifyTone(c.s, c.l);
    return {
      hex, r, g, b,
      h: round(c.h), s: round(c.s), l: round(c.l),
      rgb: `rgb(${r}, ${g}, ${b})`,
      hsl: `hsl(${round(c.h)}, ${round(c.s)}%, ${round(c.l)}%)`,
      tone: cls.tone.id, toneName: cls.tone.name, toneLabel: cls.label,
    };
  }

  function buildExport(kind) {
    const list = state.cards.map(colorDetails);
    if (kind === "hex") return list.map((c) => c.hex).join("\n");

    if (kind === "css") {
      const lines = list.map((c, i) => `  --color-${i + 1}: ${c.hex}; /* ${c.toneName} ${c.hsl} */`);
      return ":root {\n" + lines.join("\n") + "\n}";
    }

    if (kind === "tailwind") {
      // 100, 200, ... のスケールキーで Tailwind の theme.extend.colors 形式に整形する
      const entries = list.map((c, i) => `          "${(i + 1) * 100}": "${c.hex}",`);
      return [
        "/** @type {import('tailwindcss').Config} */",
        "module.exports = {",
        "  theme: {",
        "    extend: {",
        "      colors: {",
        "        palette: {",
        ...entries,
        "        },",
        "      },",
        "    },",
        "  },",
        "};",
      ].join("\n");
    }

    // JSON
    return JSON.stringify({
      baseHue: round(state.baseHue),
      tone: state.toneId,
      toneName: getTone(state.toneId).name,
      rule: state.ruleId,
      ruleName: getRule(state.ruleId).name,
      count: state.count,
      colors: list.map((c, i) => ({
        hex: c.hex,
        rgb: { r: c.r, g: c.g, b: c.b },
        hsl: { h: c.h, s: c.s, l: c.l },
        tone: c.tone,
        toneName: c.toneName,
        role: roleOf(i) || null,
        contrast: {
          white: Number(contrastRatio(c.hex, "#ffffff").toFixed(2)),

  let toastTimer = null;
  function showToast(message) {
    el.toast.textContent = message;

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), TOAST_MS);
  }

  async function copyText(text, message) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        // 非セキュアコンテキスト向けのフォールバック
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      showToast(message);
    } catch (e) {
      showToast("コピーできませんでした");
    }
  }

  /* =========================================================================
   * 12. サンプルWebサイトの役割（ロール）割り当て
   *    パレットの色を、実際のWebサイトの各要素（背景・文字・アクセント等）に割り当てる。
   * ========================================================================= */
  function buildSiteRoles() {
    const list = state.cards.map(colorDetails);
    const pick = (role) => list[clamp(state.roles[role] || 0, 0, list.length - 1)] || list[0];
    const baseColor = pick("base");       // 背景と面のもとになる色
    const textColor = pick("text");       // 文字の色
    const accent = pick("accent");        // 主要ボタンなどのアクセント
    const secondary = pick("secondary");  // サブのアクセント

    // 背景が明るいか暗いかは、背景役の色の明度で判定する
    const isLight = baseColor.l >= 55;

    // 背景は背景役の色相を保ちつつ彩度を抑え、「面」として使えるようにする
    const bgHsl = isLight
      ? { h: baseColor.h, s: clamp(baseColor.s * 0.4, 0, 26), l: clamp(baseColor.l + 6, 0, 95) }
      : { h: baseColor.h, s: clamp(baseColor.s * 0.5, 0, 30), l: clamp(baseColor.l - 8, 4, 32) };
    const bg = hslToHex(bgHsl.h, bgHsl.s, bgHsl.l);

    // 文字は文字役の色。背景とのコントラストが足りないときだけ白黒に逃がす
    const text = contrastRatio(bg, textColor.hex) >= WCAG.AA ? textColor.hex : bestTextOn(bg);

    // 面（カード・ナビ）は背景から一段だけずらす
    const surface = isLight
      ? hslToHex(bgHsl.h, bgHsl.s, clamp(bgHsl.l - 5, 0, 100))
      : hslToHex(bgHsl.h, bgHsl.s, clamp(bgHsl.l + 5, 0, 100));
    const surfaceAlt = isLight
      ? hslToHex(bgHsl.h, bgHsl.s, clamp(bgHsl.l - 10, 0, 100))
      : hslToHex(bgHsl.h, bgHsl.s, clamp(bgHsl.l + 10, 0, 100));

    const border = mixHex(text, bg, 0.82);
    const textMuted = mixHex(text, bg, 0.42);
    const accentFg = bestTextOn(accent.hex);
    const secondaryFg = bestTextOn(secondary.hex);
    const cardText = contrastRatio(surface, text) >= WCAG.AA ? text : bestTextOn(surface);

    return { bg, surface, surfaceAlt, text, textMuted, border, accent, accentFg, secondary, secondaryFg, cardText, list };
  }

  /* =========================================================================
   * 13.5 色相環とトーンマップ
   *      PCCS の 2 つの図をそのままコントロールにする。色相環の丸は 24 色相、
   *      トーンマップの丸は各トーンの位置で、どちらもクリックで選べる。
   *      現在のパレットは、色相環では中心から伸びる線、トーンマップでは
   *      小さな点として重ねて表示する。
   * ========================================================================= */
  const SVG_NS = "http://www.w3.org/2000/svg";
  const svgEl = (name, attrs) => {
    const node = document.createElementNS(SVG_NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    return node;
  };

  /** 図のうち、位置が変わらない部分（ピンとトーンマップの外形）を一度だけ作る */
  function buildFigures() {
    PCCS_HUES.forEach((hue) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pin hue-pin";
      b.dataset.hue = String(hue.n);
      b.style.left = (50 + Math.cos(toRad(pccsAngle(hue.n))) * WHEEL_R) + "%";
      b.style.top = (50 + Math.sin(toRad(pccsAngle(hue.n))) * WHEEL_R) + "%";
      b.title = `${hue.n}:${hue.code}（${hue.jp}）`;
      b.setAttribute("aria-label", `色相 ${hue.n} ${hue.jp}`);
      el.huePins.appendChild(b);
    });

    TONES.forEach((tone) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pin tone-pin";
      b.dataset.tone = tone.id;
      b.style.left = cellX(tone.col) + "%";
      b.style.top = cellY(tone.row) + "%";
      b.textContent = tone.abbr;
      b.title = `${tone.name}（S ${tone.s[0]}–${tone.s[1]}% / L ${tone.l[0]}–${tone.l[1]}%）`;
      b.setAttribute("aria-label", `トーン ${tone.name}`);
      el.tonePins.appendChild(b);
    });
  }

  /** 色相環：リングの下地と、パレットが使っている色相への線を描く */
  function drawWheelSvg() {
    const svg = el.wheelSvg;
    svg.innerHTML = "";
    svg.appendChild(svgEl("circle", {
      cx: 50, cy: 50, r: WHEEL_R,
      fill: "none", stroke: "rgba(255,255,255,.10)", "stroke-width": 1,
      "vector-effect": "non-scaling-stroke",
    }));

    // 中心から、パレットの各色の色相へ線を引く
    state.cards.forEach((card) => {
      const rad = toRad(hueToAngle(card.h));
      svg.appendChild(svgEl("line", {
        x1: 50, y1: 50,
        x2: 50 + Math.cos(rad) * WHEEL_R, y2: 50 + Math.sin(rad) * WHEEL_R,
        stroke: cardHex(card), "stroke-width": 2.5, "stroke-linecap": "round",
        "vector-effect": "non-scaling-stroke",
      }));
    });

    // 中心（線の集まる点）は基準色
    const base = toneColor(state.baseHue, getTone(state.toneId), 0);
    svg.appendChild(svgEl("circle", {
      cx: 50, cy: 50, r: 4,
      fill: hslToHex(base.h, base.s, base.l),
      stroke: "rgba(255,255,255,.85)", "stroke-width": 1.5,
      "vector-effect": "non-scaling-stroke",
    }));
  }

  /** トーンマップ：外形と、パレットの各色の位置を描く */
  function drawToneSvg() {
    const svg = el.toneSvg;
    svg.innerHTML = "";

    // PCCS のトーンマップを思わせる外形（左は垂直、右へふくらむ D 字）
    const [x0, x1] = TONE_PLOT.x, [y0, y1] = TONE_PLOT.y;
    const left = x0 - 4, top = y0 - 5, bottom = y1 + 7;
    const yc = (top + bottom) / 2;
    const straight = x0 + (x1 - x0) * 0.57;  // 上下の直線部分が終わる位置
    const far = x1 + 12;                     // ふくらみの先端
    svg.appendChild(svgEl("path", {
      d: `M ${left} ${top} L ${straight} ${top} Q ${far} ${top} ${far} ${yc}`
        + ` Q ${far} ${bottom} ${straight} ${bottom} L ${left} ${bottom} Z`,
      fill: "rgba(255,255,255,.04)", stroke: "rgba(255,255,255,.18)", "stroke-width": 1,
      "vector-effect": "non-scaling-stroke",
    }));

  }

  /** つまみの数をパレットの色数に合わせる（ドラッグ中の要素を作り直さないため差分で） */
  function syncHandles(container, kind) {
    while (container.children.length > state.cards.length) container.lastChild.remove();
    while (container.children.length < state.cards.length) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "handle";
      b.dataset.kind = kind;
      b.dataset.index = String(container.children.length);
      b.title = kind === "hue" ? "ドラッグでこの色の色相を変える" : "ドラッグでこの色のトーンを変える";
      b.setAttribute("aria-label", b.title);
      container.appendChild(b);
    }
  }

  /** 色ごとのつまみの位置・色・選択状態を更新する */
  function updateHandles() {
    syncHandles(el.hueHandles, "hue");
    syncHandles(el.toneHandles, "tone");
    state.cards.forEach((card, i) => {
      const hex = cardHex(card);
      const rad = toRad(hueToAngle(card.h));
      const hueHandle = el.hueHandles.children[i];
      hueHandle.style.left = (50 + Math.cos(rad) * HANDLE_R) + "%";
      hueHandle.style.top = (50 + Math.sin(rad) * HANDLE_R) + "%";
      hueHandle.style.background = hex;
      hueHandle.classList.toggle("active", state.activeCard === i);

      const p = colorToTonePos(card.s, card.l);
      const toneHandle = el.toneHandles.children[i];
      toneHandle.style.left = p.x + "%";
      toneHandle.style.top = p.y + "%";
      toneHandle.style.background = hex;
      toneHandle.classList.toggle("active", state.activeCard === i);
    });
  }

  /**
   * 図を塗るときの基準色。色をドラッグ／選択しているあいだはその色を使い、
   * 選んでいなければ基準色相＋選択中のトーンを使う。
   */
  function figureBase() {
    const card = state.cards[state.activeCard];
    if (card) return { h: card.h, s: card.s, l: card.l };
    const c = toneColor(state.baseHue, getTone(state.toneId), 0);
    return { h: c.h, s: c.s, l: c.l };
  }

  /** ピンの色と選択状態を、現在の色相・トーンに合わせて更新する */
  function updatePins() {
    const base = figureBase();
    const usedHues = state.cards.map((c) => c.h);

    for (const b of el.huePins.children) {
      const n = Number(b.dataset.hue);
      const hue = pccsToHue(n);
      const hex = hslToHex(hue, base.s, base.l);
      const used = usedHues.some((h) => hueGap(h, hue) < 7.5);
      const current = hueGap(state.baseHue, hue) < 7.5;
      b.style.background = hex;
      b.style.color = bestTextOn(hex);
      b.textContent = used ? String(n) : "";
      b.classList.toggle("used", used);
      b.classList.toggle("current", current);
      b.setAttribute("aria-pressed", String(current));
    }

    for (const b of el.tonePins.children) {
      const t = getTone(b.dataset.tone);
      const c = toneColor(base.h, t, 0);
      const hex = hslToHex(c.h, c.s, c.l);
      b.style.background = hex;
      b.style.color = bestTextOn(hex);
      b.classList.toggle("current", t.id === state.toneId);
      b.setAttribute("aria-pressed", String(t.id === state.toneId));
    }
  }

  function renderFigures() {
    drawWheelSvg();
    drawToneSvg();
    updatePins();
    updateHandles();
  }

  /* =========================================================================
   * 14. レンダリング（コントロール・パレット・エクスポート・履歴）
   * ========================================================================= */
  function renderControls() {
    el.hue.value = String(round(state.baseHue));
    el.hueValue.textContent = round(state.baseHue) + "°";
    el.count.value = String(state.count);
    el.countValue.textContent = state.count + " 色";
    el.rule.value = state.ruleId;
    el.toneValue.textContent = getTone(state.toneId).name;
    el.lockHue.checked = state.lockHue;
    el.lockTone.checked = state.lockTone;
    el.lockRule.checked = state.lockRule;
  }

  /** カードの骨組みを作る（値の入る部分は updateCard が埋める） */
  function buildPalette() {
    el.palette.innerHTML = "";
    state.cards.forEach((card, index) => {
      const node = document.createElement("article");
      node.className = "card";
      node.innerHTML = `
        <button class="swatch" data-act="copy-hex" data-index="${index}"></button>
        <div class="card-body">
          <div class="card-top">
            <span class="hex"></span>
            <button class="lock-btn" type="button" data-act="toggle-lock" data-index="${index}"></button>
          </div>
          <div class="card-tags">
            <button class="role-badge" type="button" data-act="cycle-role" data-index="${index}"></button>
            <span class="tone-badge"></span>
          </div>
          <div class="contrast">
            <span class="cbadge" title="白文字とのコントラスト比"></span>
            <span class="cbadge" title="黒文字とのコントラスト比"></span>
          </div>
          <div class="adjust">
            <label><span>S</span>
              <input type="range" min="0" max="100" step="1"
                     data-act="adjust-s" data-index="${index}" aria-label="彩度を調整">
              <span class="adjust-value"></span></label>
            <label><span>L</span>
              <input type="range" min="0" max="100" step="1"
                     data-act="adjust-l" data-index="${index}" aria-label="明度を調整">
              <span class="adjust-value"></span></label>
          </div>
        </div>`;
      el.palette.appendChild(node);
    });
  }

  /** カード 1 枚の表示を、DOM を作り直さずに更新する */
  function updateCard(index) {
    const node = el.palette.children[index];
    const card = state.cards[index];
    if (!node || !card) return;
    const d = colorDetails(card);
    const fg = bestTextOn(d.hex);
    const cw = contrastRatio(d.hex, "#ffffff");
    const cb = contrastRatio(d.hex, "#000000");
    const lw = wcagLevel(cw), lb = wcagLevel(cb);

    node.classList.toggle("locked", card.locked);

    const swatch = node.querySelector(".swatch");
    swatch.style.background = d.hex;
    swatch.style.color = fg;
    swatch.title = `${d.hex} をコピー`;
    swatch.setAttribute("aria-label", `${d.hex} をクリップボードにコピー`);

    node.querySelector(".hex").textContent = d.hex.toUpperCase();
    node.querySelector(".tone-badge").textContent = d.toneLabel;

    // この色がプレビューのどこに使われているか
    const role = roleOf(index);
    const roleBadge = node.querySelector(".role-badge");
    roleBadge.textContent = role || "役割なし";
    roleBadge.classList.toggle("empty", !role);
    roleBadge.title = role
      ? `プレビューの「${role}」に使われている色。クリックで次の役割と入れ替える`
      : "クリックでこの色に役割を割り当てる";
    roleBadge.setAttribute("aria-label", roleBadge.title);

    const badges = node.querySelectorAll(".cbadge");
    badges[0].className = `cbadge ${lw.cls}`;
    badges[0].innerHTML = `白 ${cw.toFixed(1)} <span class="lvl">${lw.label}</span>`;
    badges[1].className = `cbadge ${lb.cls}`;
    badges[1].innerHTML = `黒 ${cb.toFixed(1)} <span class="lvl">${lb.label}</span>`;

    // スライダーは値だけを合わせる（要素を作り直すとドラッグが途切れるため）
    const sliders = node.querySelectorAll("input[type=range]");
    const values = node.querySelectorAll(".adjust-value");
    sliders[0].value = String(round(card.s));
    sliders[1].value = String(round(card.l));
    values[0].textContent = round(card.s) + "%";
    values[1].textContent = round(card.l) + "%";

    const lock = node.querySelector("[data-act='toggle-lock']");
    lock.setAttribute("aria-pressed", String(card.locked));
    lock.textContent = card.locked ? "🔒" : "🔓";
    lock.title = card.locked ? "ロック中（ランダム生成で変えない）" : "この色をロックする";
    lock.setAttribute("aria-label", lock.title);
  }

  function renderPalette() {
    // 枚数が変わったときだけ作り直す。ドラッグ中のスライダーを壊さないため、
    // それ以外は既存のカードの表示だけを更新する。
    if (el.palette.children.length !== state.cards.length) buildPalette();
    state.cards.forEach((_, index) => updateCard(index));
  }

  function renderExportTabs() {
    if (el.exportTabs.children.length === 0) {
      EXPORT_TABS.forEach((tab) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tab";
        b.setAttribute("role", "tab");
        b.dataset.tab = tab.id;
        b.textContent = tab.label;
        el.exportTabs.appendChild(b);
      });
    }
    for (const b of el.exportTabs.children) {
      b.setAttribute("aria-selected", String(b.dataset.tab === state.exportTab));
    }
    el.exportCode.textContent = buildExport(state.exportTab);
  }

  function renderHistory() {
    el.history.innerHTML = "";
    el.historyEmpty.hidden = state.history.length > 0;
    state.history.forEach((item, index) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "history-item";
      b.dataset.act = "restore";
      b.dataset.index = String(index);
      b.title = "クリックで復元";
      b.innerHTML = `
        <span class="history-strip">${item.hexes.map((h) => `<span style="background:${h}"></span>`).join("")}</span>
        <span class="history-meta">${getTone(item.toneId).name} / H${round(item.baseHue)}°<br>${getRule(item.ruleId).name.replace(/（.*）/, "")}</span>`;
      el.history.appendChild(b);
    });
  }

  /** コントロールパネルの配色（ダーク／ライト）を適用する */
  function applyTheme() {
    document.documentElement.dataset.theme = state.theme;
    el.btnTheme.textContent = state.theme === "dark" ? "🌙" : "☀️";
    el.btnTheme.setAttribute("aria-pressed", String(state.theme === "light"));
    el.btnTheme.title = state.theme === "dark" ? "ライトテーマに切り替える" : "ダークテーマに切り替える";
    try { localStorage.setItem("palette-theme", state.theme); } catch (_) {}
  }

  /** 前回選んだテーマを引き継ぐ（既定は、生成した色を見比べやすいダーク） */
  function initialTheme() {
    try {
      const saved = localStorage.getItem("palette-theme");
      if (saved === "light" || saved === "dark") return saved;
    } catch (_) {}
    return "dark";
  }

  function renderSampleTabs() {
    for (const btn of el.sampleTabs.children) {
      btn.setAttribute("aria-selected", String(btn.dataset.sample === state.sample));
    }
  }

  /** パレット・エクスポート・履歴のタブの表示を切り替える */
  function renderMainTabs() {
    for (const btn of el.mainTabs.children) {
      btn.setAttribute("aria-selected", String(btn.dataset.pane === state.mainPane));
    }
    for (const [name, pane] of Object.entries(el.panes)) {
      pane.hidden = name !== state.mainPane;
    }
  }

  function render() {
    renderControls();
    renderMainTabs();
    renderSampleTabs();
    renderFigures();
    renderPalette();
    renderSample();
    renderExportTabs();
    renderHistory();
    syncUrl();
  }

  /* =========================================================================
   * 15. 初期化とイベント
   * ========================================================================= */
  function buildRuleSelect() {
    RULES.forEach((rule) => {
      const o = document.createElement("option");
      o.value = rule.id;
      o.textContent = rule.name;
      el.rule.appendChild(o);
    });
  }

  function onSettingChange() {
    state.activeCard = null;
    regenerate();
    pushHistory();
    render();
  }

  /** ステージ内のポインタ位置を % で返す */
  function stagePercent(stage, e) {
    const rect = stage.getBoundingClientRect();
    return { x: ((e.clientX - rect.left) / rect.width) * 100, y: ((e.clientY - rect.top) / rect.height) * 100 };
  }

  /** 1 色だけを更新して、図・カード・プレビューに反映する */
  function applyHandle(index, kind, pos) {
    const card = state.cards[index];
    if (!card) return;
    if (kind === "hue") {
      card.h = posToHue(pos.x, pos.y);
    } else {
      const t = posToTone(pos.x, pos.y);
      card.s = t.s;
      card.l = t.l;
    }
    state.activeCard = index;
    renderFigures();
    updateCard(index);
    renderSample();
    renderExportTabs();
    syncUrl();
  }

  /** つまみのドラッグとキーボード操作を割り当てる */
  function bindHandles(stage, container) {
    let dragging = null;

    container.addEventListener("pointerdown", (e) => {
      const handle = e.target.closest(".handle");
      if (!handle || e.button !== 0) return;
      dragging = { index: Number(handle.dataset.index), kind: handle.dataset.kind };
      state.activeCard = dragging.index;
      renderFigures();
      try { handle.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    });

    container.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      applyHandle(dragging.index, dragging.kind, stagePercent(stage, e));
    });

    const finish = () => { if (dragging) { dragging = null; pushHistory(); } };
    container.addEventListener("pointerup", finish);
    container.addEventListener("pointercancel", finish);
    container.addEventListener("lostpointercapture", finish);

    // 矢印キーでも微調整できるようにする
    container.addEventListener("keydown", (e) => {
      const handle = e.target.closest(".handle");
      if (!handle) return;
      const step = e.shiftKey ? 5 : 1;
      const index = Number(handle.dataset.index);
      const card = state.cards[index];
      if (!card) return;
      let moved = true;
      if (handle.dataset.kind === "hue") {
        if (e.key === "ArrowRight" || e.key === "ArrowUp") card.h = normalizeHue(card.h + step);
        else if (e.key === "ArrowLeft" || e.key === "ArrowDown") card.h = normalizeHue(card.h - step);
        else moved = false;
      } else {
        if (e.key === "ArrowRight") card.s = clamp(card.s + step, 0, 100);
        else if (e.key === "ArrowLeft") card.s = clamp(card.s - step, 0, 100);
        else if (e.key === "ArrowUp") card.l = clamp(card.l + step, 0, 100);
        else if (e.key === "ArrowDown") card.l = clamp(card.l - step, 0, 100);
        else moved = false;
      }
      if (!moved) return;
      e.preventDefault();
      state.activeCard = index;
      renderFigures();
      updateCard(index);
      renderSample();
      renderExportTabs();
      syncUrl();
      pushHistory();
      container.children[index].focus();
    });
  }

  function bindEvents() {
    $("btn-random").addEventListener("click", randomize);
    $("btn-share").addEventListener("click", () => copyText(shareUrl(), "共有URLをコピーしました"));
    $("btn-share-2").addEventListener("click", () => copyText(shareUrl(), "共有URLをコピーしました"));
    $("btn-copy-export").addEventListener("click", () => {
      const label = EXPORT_TABS.find((t) => t.id === state.exportTab).label;
      copyText(buildExport(state.exportTab), `${label} をコピーしました`);
    });

    // パネルの折りたたみ
    el.btnCollapse.addEventListener("click", () => {
      const collapsed = el.floatPanel.classList.toggle("collapsed");
      el.btnCollapse.textContent = collapsed ? "+" : "−";
      el.btnCollapse.setAttribute("aria-expanded", String(!collapsed));
      el.btnCollapse.title = collapsed ? "パネルを展開する" : "パネルを折りたたむ";
    });

    // パネルのドラッグ移動（ヘッダーを掴んで移動）
    let dragStart = null;
    el.floatHead.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button, input, select, a")) return;
      dragStart = { x: e.clientX, y: e.clientY, left: el.floatPanel.offsetLeft, top: el.floatPanel.offsetTop };
      el.floatHead.classList.add("dragging");
      el.floatHead.setPointerCapture(e.pointerId);
    });
    el.floatHead.addEventListener("pointermove", (e) => {
      if (!dragStart) return;
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      const maxLeft = Math.max(0, window.innerWidth - el.floatPanel.offsetWidth);
      const maxTop = Math.max(0, window.innerHeight - el.floatPanel.offsetHeight);
      el.floatPanel.style.left = Math.min(maxLeft, Math.max(0, dragStart.left + dx)) + "px";
      el.floatPanel.style.top = Math.min(maxTop, Math.max(0, dragStart.top + dy)) + "px";
    });
    const endDrag = (e) => {
      if (!dragStart) return;
      dragStart = null;
      el.floatHead.classList.remove("dragging");
      if (el.floatHead.hasPointerCapture(e.pointerId)) el.floatHead.releasePointerCapture(e.pointerId);
    };
    el.floatHead.addEventListener("pointerup", endDrag);
    el.floatHead.addEventListener("pointercancel", endDrag);

    // パレット・エクスポート・履歴のタブ
    el.mainTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      state.mainPane = btn.dataset.pane;
      renderMainTabs();
    });

    // 色相スライダー：ドラッグ中は履歴に積まず、確定時のみ記録する
    el.hue.addEventListener("input", (e) => {
      state.baseHue = normalizeHue(parseInt(e.target.value, 10));
      regenerate();
      render();
    });
    el.hue.addEventListener("change", pushHistory);

    el.count.addEventListener("input", (e) => {
      state.count = clamp(parseInt(e.target.value, 10), MIN_COLORS, MAX_COLORS);
      onSettingChange();
    });

    el.rule.addEventListener("change", (e) => { state.ruleId = e.target.value; onSettingChange(); });

    el.lockHue.addEventListener("change", (e) => { state.lockHue = e.target.checked; });
    el.lockTone.addEventListener("change", (e) => { state.lockTone = e.target.checked; });
    el.lockRule.addEventListener("change", (e) => { state.lockRule = e.target.checked; });

    // 図のピンをクリックして、パレット全体の色相・トーンを選ぶ
    el.huePins.addEventListener("click", (e) => {
      const btn = e.target.closest(".hue-pin");
      if (!btn) return;
      state.baseHue = pccsToHue(Number(btn.dataset.hue));
      state.activeCard = null;
      onSettingChange();
    });

    el.tonePins.addEventListener("click", (e) => {
      const btn = e.target.closest(".tone-pin");
      if (!btn) return;
      state.toneId = btn.dataset.tone;
      state.activeCard = null;
      onSettingChange();
    });

    // 色ごとのつまみ：ドラッグでその 1 色だけを変える
    bindHandles(el.wheelStage, el.hueHandles);
    bindHandles(el.toneStage, el.toneHandles);

    el.btnTheme.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });

    el.sampleTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      state.sample = btn.dataset.sample;
      renderSampleTabs();
      renderSample();
      syncUrl();
    });

    el.exportTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      state.exportTab = btn.dataset.tab;
      renderExportTabs();
    });

    // パレットカード（クリック：コピー／ロック）
    el.palette.addEventListener("click", (e) => {
      const target = e.target.closest("[data-act]");
      if (!target) return;
      const index = Number(target.dataset.index);
      if (target.dataset.act === "copy-hex") {
        copyText(cardHex(state.cards[index]).toUpperCase(), `${cardHex(state.cards[index]).toUpperCase()} をコピーしました`);
      } else if (target.dataset.act === "cycle-role") {
        const before = state.cards.map((_, i) => roleOf(i));
        if (swapRole(index, nextRoleId(index))) {
          state.cards.forEach((_, i) => { if (before[i] !== roleOf(i)) updateCard(i); });
          renderSample();
          renderExportTabs();
          pushHistory();
          showToast(`${cardHex(state.cards[index]).toUpperCase()} を「${roleOf(index)}」にしました`);
        }
      } else if (target.dataset.act === "toggle-lock") {
        state.cards[index].locked = !state.cards[index].locked;
        updateCard(index);
      }
    });

    // パレットカード（明度・彩度の微調整）
    el.palette.addEventListener("input", (e) => {
      const target = e.target.closest("[data-act]");
      if (!target) return;
      const index = Number(target.dataset.index);
      const value = clamp(parseInt(target.value, 10), 0, 100);
      if (target.dataset.act === "adjust-s") state.cards[index].s = value;
      else if (target.dataset.act === "adjust-l") state.cards[index].l = value;
      else return;
      updateCard(index);
      renderFigures();
      renderSample();
      renderExportTabs();
    });

    el.history.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act='restore']");
      if (btn) restoreHistory(Number(btn.dataset.index));
    });

    // キーボードショートカット：スペースでランダム生成
    document.addEventListener("keydown", (e) => {
      if (e.code !== "Space" && e.key !== " ") return;
      const t = e.target;
      const tag = t && t.tagName ? t.tagName.toLowerCase() : "";
      if (["input", "select", "textarea", "button", "a"].includes(tag) || (t && t.isContentEditable)) return;
      e.preventDefault();
      randomize();
    });
  }

  function init() {
    state.theme = initialTheme();
    applyTheme();
    buildFigures();
    buildRuleSelect();
    bindEvents();
    applyQuery();
    regenerate();
    pushHistory();
    render();
  }

  init();
})();
</script>
</body>
</html>
